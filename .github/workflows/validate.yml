name: Validate examples

# Validates every JSON document under examples/ against the spec's JSON Schema
# via kg-validate-action. Each example is dispatched to the matching renderer
# based on its top-level version field, then ajv-checked against the bundled
# JSON Schema 2020-12 document.
#
# The published v0.1.0 action bundles the baseline schema, so aviation profile
# examples live under profiles/ and are checked below against this repo's
# current schema. Fails the PR if either validation path regresses.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-examples:
    name: Validate against Kinetic Gain Protocol Suite schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mizcausevic-dev/kg-validate-action@v0.1.0
        with:
          files: 'examples/**/*.json'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
